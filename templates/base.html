<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assessment Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Assessment Tracker</a>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>
  </header>
  {% if view and view.offline %}
  <div class="banner">Offline — assessments unable to update</div>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
